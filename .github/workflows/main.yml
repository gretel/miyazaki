name: Build Tezuka Firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. 0.6.0)'
        type: string
        required: true
      boards:
        description: 'Boards to build (comma-separated, or "all")'
        type: string
        required: false
        default: 'all'

permissions:
  contents: write

run-name: Build tezuka_fw - Tezuka_${{ inputs.version }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # Mini variants share toolchain/kernel -- skip in CI to save runner time.
          ALL='["pluto","plutoplus","e200","e310","libre","fishball","fishball7020","nano","signalsdrpro"]'
          INPUT="${{ inputs.boards }}"
          if [ "$INPUT" = "all" ] || [ -z "$INPUT" ]; then
            echo "matrix={\"board\":${ALL}}" >> "$GITHUB_OUTPUT"
          else
            BOARDS=$(echo "$INPUT" | jq -Rc 'split(",")|map(ltrimstr(" ")|rtrimstr(" "))')
            echo "matrix={\"board\":${BOARDS}}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -y make gcc g++ \
            zip unzip dfu-util fakeroot u-boot-tools device-tree-compiler \
            mtools bison flex libncurses5-dev libssl-dev bc cpio rsync \
            cmake xz-utils libgmp-dev libmpc-dev bootgen-xlnx libclang-dev

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ~/br-dl
          key: br-dl-${{ hashFiles('configs/*') }}
          restore-keys: br-dl-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ matrix.board }}-week${{ github.run_number }}
          restore-keys: ccache-${{ matrix.board }}-

      - name: Build ${{ matrix.board }}
        run: |
          ./getbuildroot.sh
          source sourceme.first
          export BR2_DL_DIR=~/br-dl
          ./build.sh "${{ matrix.board }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tezuka-${{ matrix.board }}
          path: build/${{ matrix.board }}.zip

  smoke-test:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    # Run smoke test for fishball builds (push trigger or if fishball is in matrix)
    if: always() && needs.build.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tezuka-fishball
          path: firmware/
        continue-on-error: true
        id: download

      - name: Install QEMU
        if: steps.download.outcome == 'success'
        run: sudo apt-get install -y -qq qemu-system-arm

      - name: Extract firmware
        if: steps.download.outcome == 'success'
        run: |
          cd firmware
          unzip -o ./*.zip sdimg/*
          # Strip mkimage header (64 bytes) to get raw kernel and initrd
          dd if=sdimg/uImage of=zImage bs=64 skip=1 2>/dev/null
          dd if=sdimg/uramdisk.image.gz of=uramdisk.gz bs=64 skip=1 2>/dev/null

      - name: QEMU boot test
        if: steps.download.outcome == 'success'
        run: |
          cd firmware
          # Boot with 45s timeout — kernel should reach login prompt in ~10s
          timeout 45 qemu-system-arm \
            -M xilinx-zynq-a9 \
            -m 512M \
            -kernel zImage \
            -dtb sdimg/devicetree.dtb \
            -initrd uramdisk.gz \
            -serial stdio \
            -nographic \
            -no-reboot \
            -append "console=ttyPS0,115200 root=/dev/ram rw" \
            2>&1 | tee boot.log || true

          echo ""
          echo "=== Boot test results ==="

          # Check for successful boot markers
          if grep -q "login:" boot.log; then
            echo "PASS: reached login prompt"
          elif grep -q "Please press Enter to activate" boot.log; then
            echo "PASS: reached console prompt"
          elif grep -q "Welcome to Buildroot" boot.log; then
            echo "PASS: reached Buildroot init"
          elif grep -q "Kernel panic" boot.log; then
            echo "FAIL: kernel panic"
            grep "Kernel panic" boot.log
            exit 1
          else
            echo "WARN: boot may have stalled (no login prompt within timeout)"
            echo "Last 10 lines:"
            tail -10 boot.log
            # Don't fail — QEMU Zynq emulation may not reach login
            # with a real board DTB. The absence of panic is still useful.
          fi

  release:
    needs: [build, smoke-test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: tezuka-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "Tezuka_${{ inputs.version }}" \
            artifacts/*.zip \
            -R "${{ github.repository }}" \
            --generate-notes
